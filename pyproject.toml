[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aegissys"
version = "0.1.0"
description = "Explainable Multi-Agent AI System for Intelligent Cybersecurity Assessment and Safe Threat Remediation"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "ruff>=0.13,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"